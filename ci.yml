from __future__ import annotations

from contextlib import asynccontextmanager

from fastapi import FastAPI, Request
from fastapi.middleware.cors import CORSMiddleware
from fastapi.responses import ORJSONResponse
from prometheus_client import CONTENT_TYPE_LATEST, generate_latest
from starlette.middleware.trustedhost import TrustedHostMiddleware
from starlette.responses import Response

from app.api.routes import (
    backtests,
    compatibility,
    datasets,
    health,
    models,
    outcomes,
    predictions,
    stations,
    training,
)
from app.core.config import get_settings
from app.core.exceptions import ServiceError
from app.core.logging import configure_logging
from app.core.middleware import RequestContextMiddleware, SimpleRateLimitMiddleware
from app.db.base import Base
from app.db.session import engine

configure_logging()
settings = get_settings()


@asynccontextmanager
async def lifespan(_: FastAPI):
    if settings.auto_create_tables:
        Base.metadata.create_all(bind=engine)
    yield


app = FastAPI(
    title=settings.app_name,
    version="1.0.0",
    description=(
        "Secure model training, calibrated weather-market probability inference, backtesting, "
        "model registry, and outcome evaluation for a Kalshi-connected application."
    ),
    lifespan=lifespan,
    default_response_class=ORJSONResponse,
)
app.add_middleware(RequestContextMiddleware)
app.add_middleware(SimpleRateLimitMiddleware)
app.add_middleware(TrustedHostMiddleware, allowed_hosts=settings.trusted_hosts)
if settings.cors_origins:
    app.add_middleware(
        CORSMiddleware,
        allow_origins=settings.cors_origins,
        allow_credentials=False,
        allow_methods=["GET", "POST", "PUT", "PATCH", "DELETE"],
        allow_headers=["Content-Type", "X-API-Key", "X-Admin-Key", "X-Request-ID"],
    )


@app.exception_handler(ServiceError)
async def service_error_handler(_: Request, exc: ServiceError) -> ORJSONResponse:
    return ORJSONResponse(status_code=exc.status_code, content={"detail": exc.as_detail()})


app.include_router(health.router)
app.include_router(stations.router, prefix=settings.api_prefix)
app.include_router(datasets.router, prefix=settings.api_prefix)
app.include_router(predictions.router, prefix=settings.api_prefix)
app.include_router(training.router, prefix=settings.api_prefix)
app.include_router(models.router, prefix=settings.api_prefix)
app.include_router(backtests.router, prefix=settings.api_prefix)
app.include_router(outcomes.router, prefix=settings.api_prefix)
app.include_router(compatibility.router, prefix=settings.api_prefix)


@app.get("/metrics", include_in_schema=False)
def metrics() -> Response:
    if not settings.prometheus_enabled:
        return Response(status_code=404)
    return Response(generate_latest(), media_type=CONTENT_TYPE_LATEST)
