from __future__ import annotations

from datetime import UTC, datetime, timedelta


def test_health_is_public(client):
    response = client.get("/health")
    assert response.status_code == 200
    assert response.json()["status"] == "online"


def test_private_endpoint_rejects_missing_key(client):
    response = client.get("/v1/model-health")
    assert response.status_code == 401


def test_model_health_before_or_after_training(client):
    response = client.get("/v1/model-health", headers={"X-API-Key": "test-api-key"})
    assert response.status_code == 200
    assert "model_status" in response.json()


def test_prediction_end_to_end(client, trained_model):
    now = datetime.now(UTC)
    payload = {
        "market_id": "pytest-market-1",
        "market_ticker": "PYTEST-TICKER-1",
        "station_code": "KTEST",
        "market_type": "daily_high_temperature",
        "target_time": (now + timedelta(hours=20)).isoformat(),
        "lower_bound": 70,
        "upper_bound": 72,
        "unit": "F",
        "weather_forecasts": [
            {"predicted_high": 71.2},
            {"predicted_high": 72.0},
            {"predicted_high": 70.8},
        ],
        "weather_observations": [
            {
                "observation_time": (now - timedelta(hours=1)).isoformat(),
                "temperature": 63.0,
                "dew_point": 55.0,
                "humidity": 62.0,
                "wind_speed": 7.0,
                "wind_direction": 190.0,
                "cloud_cover": 30.0,
                "pressure": 1012.0,
                "precipitation_probability": 15.0,
            },
            {
                "observation_time": now.isoformat(),
                "temperature": 64.5,
                "dew_point": 55.0,
                "humidity": 60.0,
                "wind_speed": 8.0,
                "wind_direction": 200.0,
                "cloud_cover": 25.0,
                "pressure": 1012.0,
                "precipitation_probability": 15.0,
            },
        ],
        "brackets": [
            {"label": "68 or below", "upper_bound": 69},
            {"label": "69-70", "lower_bound": 69, "upper_bound": 71},
            {"label": "71-72", "lower_bound": 71, "upper_bound": 73},
            {"label": "73 or above", "lower_bound": 73},
        ],
    }
    response = client.post(
        "/v1/predict-market",
        headers={"X-API-Key": "test-api-key"},
        json=payload,
    )
    assert response.status_code == 200, response.text
    result = response.json()
    assert result["model_version"] == trained_model
    assert 0 < result["calibrated_probability"] < 1
    assert len(result["bracket_probabilities"]) == 4
    assert isinstance(result["trading_eligible"], bool)


def test_outcome_creates_evaluation(client, trained_model):
    response = client.post(
        "/v1/record-outcome",
        headers={"X-Admin-Key": "test-admin-key"},
        json={
            "market_id": "pytest-market-1",
            "station_code": "KTEST",
            "official_value": 71.4,
            "official_source": "pytest",
            "settled_at": datetime.now(UTC).isoformat(),
        },
    )
    assert response.status_code == 200, response.text
    assert response.json()["evaluations_created"] >= 1
