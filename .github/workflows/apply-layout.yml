name: Apply staged repository layout
on:
  push:
    branches: [fix-repo-structure]
permissions:
  contents: write
jobs:
  apply-layout:
    if: ${{ !contains(github.event.head_commit.message, '[layout-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-repo-structure
          fetch-depth: 0
      - name: Apply staged files
        run: |
          for script in $(find .rebuild -maxdepth 1 -name '*.py' | sort); do
            python "$script"
          done
      - name: Commit layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[layout-applied] Build structured Python service'
          git push origin HEAD:fix-repo-structure
